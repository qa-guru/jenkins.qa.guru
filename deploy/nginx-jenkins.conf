# legacy → canonical. One cert per server_name (do not stack both live/ dirs).
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.autotests.cloud;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://jenkins.qa.guru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jenkins.autotests.cloud;

    ssl_certificate /etc/letsencrypt/live/jenkins.autotests.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.autotests.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jenkins.qa.guru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jenkins.qa.guru;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jenkins.qa.guru;

    ssl_certificate /etc/letsencrypt/live/jenkins.qa.guru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.qa.guru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/jenkins.access.log;
    error_log  /var/log/nginx/jenkins.error.log;

    # renamed freestyle allure jobs → java-* twins (Telegram links)
    location ~ ^/job/reference-app-tests-freestyle-allure2(/.*)?$ {
        return 301 /job/reference-app-tests-freestyle-java-allure2$1;
    }
    location ~ ^/job/reference-app-tests-freestyle-allure3(/.*)?$ {
        return 301 /job/reference-app-tests-freestyle-java-allure3$1;
    }

    # Allure 3 in-report navigation only (ADR 010): the report root page links to
    # awesome/ and dashboard/ as directories, and allure-jenkins-plugin answers 500 on
    # report subdirectories. Published links use .../index.html and never hit this rule.
    # Report roots (/allure, /allure2, /allure3) are served by the plugin — do not redirect them.
    # /allure = classic single-report default; /allure3 = dual-job explicit slug.
    location ~ ^(/job/[^/]+/(?:[^/]+/)?(?:allure|allure3)/(?:awesome|dashboard))/?$ {
        return 301 $1/index.html$is_args$args;
    }

    # Allure 3 HTML attachment preview is hard-capped at ~150px (iframe sandbox without
    # allow-scripts — attachments cannot self-resize). Inject CSS so HAR Viewer / HTML
    # attachments get a usable viewport in-report and in the expand modal.
    location ~ ^/job/[^/]+/(?:(?:\d+|last(?:Completed|Successful|Failed)Build)/)?(?:allure|allure3)/(?:awesome|dashboard)/index\.html$ {
        include /etc/nginx/proxy_params;
        proxy_pass          http://127.0.0.1:8082;
        proxy_read_timeout  90s;
        proxy_redirect      http://127.0.0.1:8082 https://jenkins.qa.guru;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Forwarded-Port 443;
        proxy_set_header    Accept-Encoding "";
        sub_filter_types    text/html;
        sub_filter_once     on;
        # Inline: Allure leaves the stack without height (and iframe sandbox has no
        # allow-scripts, so the attachment cannot self-resize). Cap with CSS, then JS
        # sizes the stack to content scrollHeight. Modal: fill (Allure's
        # .html-attachment-preview selector is broken vs CSS modules).
        sub_filter '</head>' '<style id="zds-allure-html-preview">[class*="attachmentViewStack"]{max-height:min(70vh,720px)!important;min-height:80px!important;height:200px!important;display:flex!important;flex-direction:column!important;overflow:auto!important}[class*="attachmentViewPane"],[class*="html-attachment-preview"]{flex:1 1 auto!important;height:100%!important;min-height:0!important;max-height:none!important;display:flex!important;flex-direction:column!important}[class*="html-attachment-preview"] iframe{flex:1 1 auto!important;width:100%!important;height:100%!important;min-height:0!important;border:0;background:#1e1e1e}[class*="modal-wrapper"] [class*="attachmentViewStack"],[class*="modal-data-component"] [class*="attachmentViewStack"],[class*="modal-data"] [class*="attachmentViewStack"]{height:100%!important;max-height:none!important;min-height:0!important;overflow:hidden!important}[class*="modal-wrapper"] [class*="html-attachment-preview"] iframe,[class*="modal-data-component"] [class*="html-attachment-preview"] iframe,[class*="modal-data"] [class*="html-attachment-preview"] iframe{min-height:60vh!important}</style><script id="zds-allure-html-preview-js">(function(){var wired=typeof WeakSet!=="undefined"?new WeakSet():null;function inModal(el){return!!(el&&el.closest&&el.closest("[class*=modal-]"))}function contentHeight(doc){var html=doc.documentElement,body=doc.body;if(!body)return 0;html.style.setProperty("height","auto","important");html.style.setProperty("min-height","0","important");body.style.setProperty("height","auto","important");body.style.setProperty("min-height","0","important");body.style.setProperty("overflow","visible","important");var h=0;for(var i=0;i<body.children.length;i++){h+=body.children[i].offsetHeight}var cs=doc.defaultView.getComputedStyle(body);h+=parseFloat(cs.marginTop)||0;h+=parseFloat(cs.marginBottom)||0;h+=parseFloat(cs.paddingTop)||0;h+=parseFloat(cs.paddingBottom)||0;return Math.ceil(Math.max(h,1))}function wire(iframe,doc){if(wired){if(wired.has(iframe))return;wired.add(iframe)}doc.addEventListener("toggle",schedule,true);if(typeof ResizeObserver!=="undefined"){try{var ro=new ResizeObserver(schedule);ro.observe(doc.documentElement);if(doc.body)ro.observe(doc.body);var table=doc.querySelector("table");if(table)ro.observe(table)}catch(e){}}iframe.addEventListener("load",schedule)}function fit(){document.querySelectorAll("[class*=html-attachment-preview] iframe").forEach(function(iframe){if(inModal(iframe))return;var stack=iframe.closest("[class*=attachmentViewStack]");if(!stack)return;try{var doc=iframe.contentDocument;if(!doc||!doc.documentElement)return;wire(iframe,doc);var h=contentHeight(doc);if(!h)return;var max=Math.floor(window.innerHeight*0.7);var clamped=Math.max(80,Math.min(h,max));stack.style.setProperty("height",clamped+"px","important");iframe.style.setProperty("height",clamped+"px","important")}catch(e){}})}var t;function schedule(){clearTimeout(t);t=setTimeout(function(){requestAnimationFrame(function(){requestAnimationFrame(fit)})},16)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",schedule);else schedule();new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});window.addEventListener("resize",schedule);window.addEventListener("load",schedule)})();</script></head>';
    }

    # Inbound WebSocket agents (remote host, e.g. selenoid box1).
    location /wsagents/ {
        include /etc/nginx/proxy_params;
        proxy_pass          http://127.0.0.1:8082;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_read_timeout  1d;
        proxy_send_timeout  1d;
        proxy_redirect      http://127.0.0.1:8082 https://jenkins.qa.guru;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Forwarded-Port 443;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass          http://127.0.0.1:8082;
        proxy_read_timeout  90s;
        proxy_redirect      http://127.0.0.1:8082 https://jenkins.qa.guru;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Forwarded-Port 443;
    }
}
