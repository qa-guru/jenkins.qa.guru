# legacy → canonical
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jenkins.autotests.cloud www.jenkins.autotests.cloud;
    # ssl_certificate ...;
    # ssl_certificate_key ...;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://jenkins.qa.guru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jenkins.qa.guru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jenkins.qa.guru;

    # ssl_certificate ...;
    # ssl_certificate_key ...;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/jenkins.access.log;
    error_log  /var/log/nginx/jenkins.error.log;

    # renamed freestyle allure jobs → java-* twins (Telegram links)
    location ~ ^/job/reference-app-tests-freestyle-allure2(/.*)?$ {
        return 301 /job/reference-app-tests-freestyle-java-allure2$1;
    }
    location ~ ^/job/reference-app-tests-freestyle-allure3(/.*)?$ {
        return 301 /job/reference-app-tests-freestyle-java-allure3$1;
    }

    # Allure 3 in-report navigation only (ADR 010): the report root page links to
    # awesome/ and dashboard/ as directories, and allure-jenkins-plugin answers 500 on
    # report subdirectories. Published links use .../index.html and never hit this rule.
    # Report roots (allure3/, allure2/) are served by the plugin — do not redirect them.
    location ~ ^(/job/[^/]+/(?:[^/]+/)?allure3/(?:awesome|dashboard))/?$ {
        return 301 $1/index.html$is_args$args;
    }

    # Allure 3 HTML attachment preview is hard-capped at ~150px (iframe sandbox without
    # allow-scripts — attachments cannot self-resize). Inject CSS so HAR Viewer / HTML
    # attachments get a usable viewport in-report and in the expand modal.
    location ~ ^/job/[^/]+/(?:(?:\d+|last(?:Completed|Successful|Failed)Build)/)?allure3/(?:awesome|dashboard)/index\.html$ {
        include /etc/nginx/proxy_params;
        proxy_pass          http://127.0.0.1:8082;
        proxy_read_timeout  90s;
        proxy_redirect      http://127.0.0.1:8082 https://jenkins.qa.guru;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Forwarded-Port 443;
        proxy_set_header    Accept-Encoding "";
        sub_filter_types    text/html;
        sub_filter_once     on;
        # Inline: Allure leaves the stack without height (and iframe sandbox has no
        # allow-scripts, so the attachment cannot self-resize). Cap with CSS, then JS
        # sizes the stack to content scrollHeight. Modal: fill (Allure's
        # .html-attachment-preview selector is broken vs CSS modules).
        sub_filter '</head>' '<style id="zds-allure-html-preview">[class*="attachmentViewStack"]{max-height:min(70vh,720px)!important;min-height:120px!important;height:240px!important;display:flex!important;flex-direction:column!important}[class*="attachmentViewPane"],[class*="html-attachment-preview"]{flex:1 1 auto!important;height:100%!important;min-height:0!important;max-height:none!important;display:flex!important;flex-direction:column!important}[class*="html-attachment-preview"] iframe{flex:1 1 auto!important;width:100%!important;height:100%!important;min-height:0!important;border:0;background:#1e1e1e}[class*="modal-wrapper"] [class*="attachmentViewStack"],[class*="modal-data-component"] [class*="attachmentViewStack"],[class*="modal-data"] [class*="attachmentViewStack"]{height:100%!important;max-height:none!important;min-height:0!important}[class*="modal-wrapper"] [class*="html-attachment-preview"] iframe,[class*="modal-data-component"] [class*="html-attachment-preview"] iframe,[class*="modal-data"] [class*="html-attachment-preview"] iframe{min-height:60vh!important}</style><script id="zds-allure-html-preview-js">(function(){function inModal(el){return!!(el&&el.closest&&el.closest("[class*=modal-]"))}function fit(){document.querySelectorAll("[class*=html-attachment-preview] iframe").forEach(function(iframe){if(inModal(iframe))return;var stack=iframe.closest("[class*=attachmentViewStack]");if(!stack)return;try{var doc=iframe.contentDocument;if(!doc||!doc.documentElement)return;var h=Math.ceil(Math.max(doc.documentElement.scrollHeight,(doc.body&&doc.body.scrollHeight)||0));if(!h)return;var max=Math.floor(window.innerHeight*0.7);h=Math.max(120,Math.min(h,max));stack.style.setProperty("height",h+"px","important");iframe.style.setProperty("height",h+"px","important")}catch(e){}})}var t;function schedule(){clearTimeout(t);t=setTimeout(fit,50)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",schedule);else schedule();new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});window.addEventListener("resize",schedule);window.addEventListener("load",schedule)})();</script></head>';
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass          http://127.0.0.1:8082;
        proxy_read_timeout  90s;
        proxy_redirect      http://127.0.0.1:8082 https://jenkins.qa.guru;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Forwarded-Port 443;
    }
}
